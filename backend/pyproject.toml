[project]
name = "kouma-api"
version = "0.2.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests avec le vrai modèle NLLB (lents, GPU conseillé)"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
